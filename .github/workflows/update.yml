name: Cập nhật dải IP Việt Nam
on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "TND Bot"
          git config user.email "bot@tnd.vn"
          git add -A
          if git diff --cached --quiet -- vn-ipv4.txt vn-ipv6.txt; then echo "Không đổi"; exit 0; fi
          git commit -m "Cập nhật dải IP Việt Nam $(date -u +%Y-%m-%d)"
          git push
